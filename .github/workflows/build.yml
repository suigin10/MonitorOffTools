name: Build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go vet ./...
          go test ./...

      - name: Build
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -buildvcs=false -trimpath -ldflags="-H windowsgui -s -w" -o MonitorOffTools.exe .

      - name: Create release assets
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { "dev" }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item MonitorOffTools.exe, README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/MonitorOffTools-v$version.zip" -Force
          $zipPath = "dist/MonitorOffTools-v$version.zip"
          $exeHash = (Get-FileHash MonitorOffTools.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  MonitorOffTools.exe"
            "$zipHash  MonitorOffTools-v$version.zip"
          ) | Set-Content -Encoding ascii "dist/MonitorOffTools-v$version-SHA256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorOffTools-windows-x64
          path: |
            MonitorOffTools.exe
            dist/*.zip
            dist/*-SHA256.txt

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes --title "MonitorOffTools $env:GITHUB_REF_NAME"
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release upload $env:GITHUB_REF_NAME `
            MonitorOffTools.exe `
            "dist/MonitorOffTools-v$version.zip" `
            "dist/MonitorOffTools-v$version-SHA256.txt" `
            --clobber
